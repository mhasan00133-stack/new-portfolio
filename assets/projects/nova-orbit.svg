<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03040B"/>
      <stop offset="50%" stop-color="#060914"/>
      <stop offset="100%" stop-color="#0A0F24"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <radialGradient id="nebula-cyan" cx="25%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#03040B" stop-opacity="0"/>
    </radialGradient>

    <!-- Violet Glow Gradient -->
    <radialGradient id="nebula-violet" cx="75%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#03040B" stop-opacity="0"/>
    </radialGradient>

    <!-- Planet Core Gradient -->
    <radialGradient id="planet-core" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="25%" stop-color="#00F0FF"/>
      <stop offset="70%" stop-color="#0C4A6E"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="orbit-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>

    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Space Canvas -->
  <rect width="1200" height="675" fill="url(#bg-grad)"/>

  <!-- Nebula Gas Clouds -->
  <rect width="1200" height="675" fill="url(#nebula-cyan)"/>
  <rect width="1200" height="675" fill="url(#nebula-violet)"/>

  <!-- Faint Celestial Grid -->
  <g stroke="rgba(0, 240, 255, 0.05)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="500" y1="0" x2="500" y2="675"/>
    <line x1="700" y1="0" x2="700" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1100" y1="0" x2="1100" y2="675"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Twinkling Starfield -->
  <g fill="#FFFFFF">
    <circle cx="120" cy="80" r="1.5" opacity="0.8"/>
    <circle cx="180" cy="220" r="1" opacity="0.4"/>
    <circle cx="260" cy="90" r="2" opacity="0.9"/>
    <circle cx="340" cy="180" r="1.2" opacity="0.6"/>
    <circle cx="420" cy="60" r="1" opacity="0.5"/>
    <circle cx="580" cy="140" r="1.8" opacity="0.7"/>
    <circle cx="720" cy="70" r="2.2" opacity="0.85"/>
    <circle cx="860" cy="190" r="1.2" opacity="0.5"/>
    <circle cx="940" cy="90" r="1.5" opacity="0.7"/>
    <circle cx="1080" cy="150" r="2" opacity="0.9"/>
    <circle cx="150" cy="450" r="1.2" opacity="0.6"/>
    <circle cx="280" cy="540" r="1.8" opacity="0.8"/>
    <circle cx="440" cy="610" r="1" opacity="0.4"/>
    <circle cx="520" cy="490" r="1.5" opacity="0.7"/>
    <circle cx="680" cy="580" r="2" opacity="0.85"/>
    <circle cx="840" cy="510" r="1.2" opacity="0.5"/>
    <circle cx="990" cy="590" r="1.6" opacity="0.75"/>
    <circle cx="1120" cy="480" r="2.2" opacity="0.9"/>
  </g>

  <!-- Cross-Spike Prominent Stars -->
  <g stroke="#00F0FF" stroke-width="0.8" opacity="0.8">
    <line x1="260" y1="80" x2="260" y2="100"/>
    <line x1="250" y1="90" x2="270" y2="90"/>
    <line x1="1080" y1="140" x2="1080" y2="160"/>
    <line x1="1070" y1="150" x2="1090" y2="150"/>
  </g>

  <!-- Meteor Streak -->
  <line x1="980" y1="60" x2="820" y2="200" stroke="url(#orbit-cyan)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" filter="url(#glow-subtle)"/>
  <circle cx="820" cy="200" r="3.5" fill="#FFFFFF" filter="url(#glow-subtle)"/>

  <!-- Orbital Rings & Trajectory -->
  <g transform="translate(600, 310)">
    <!-- Outer Orbital Ring -->
    <ellipse cx="0" cy="0" rx="360" ry="120" fill="none" stroke="url(#orbit-cyan)" stroke-width="1.8" stroke-dasharray="6 8" opacity="0.6" transform="rotate(-18)"/>
    <!-- Mid Orbital Ring -->
    <ellipse cx="0" cy="0" rx="270" ry="85" fill="none" stroke="#00F0FF" stroke-width="2.2" opacity="0.8" transform="rotate(-18)" filter="url(#glow-subtle)"/>
    <!-- Inner Resonant Ring -->
    <ellipse cx="0" cy="0" rx="190" ry="60" fill="none" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7" transform="rotate(-18)"/>

    <!-- Orbiting Satellite Probe -->
    <g transform="translate(180, -78)">
      <circle cx="0" cy="0" r="7" fill="#00F0FF" filter="url(#glow-heavy)"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
      <!-- Pulse Rings -->
      <circle cx="0" cy="0" r="16" fill="none" stroke="#00F0FF" stroke-width="1" opacity="0.6"/>
      <circle cx="0" cy="0" r="26" fill="none" stroke="#00F0FF" stroke-width="0.8" opacity="0.3"/>
    </g>

    <!-- Central Planetary Core -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.4" filter="url(#glow-heavy)"/>
    <circle cx="0" cy="0" r="82" fill="url(#planet-core)"/>
    
    <!-- Atmospheric Cloud Band -->
    <path d="M-75 -15 C-40 -40, 40 -10, 75 -25 C50 15, -30 20, -75 -15 Z" fill="rgba(255, 255, 255, 0.25)" opacity="0.7"/>
    <path d="M-60 30 C-20 15, 30 45, 60 25 C40 50, -10 55, -60 30 Z" fill="rgba(0, 240, 255, 0.3)" opacity="0.5"/>
  </g>

  <!-- HUD Telemetry Framing & Badges -->
  <g transform="translate(60, 520)">
    <!-- Glass HUD Pill -->
    <rect width="320" height="75" rx="12" fill="rgba(10, 15, 36, 0.85)" stroke="rgba(0, 240, 255, 0.3)" stroke-width="1"/>
    <circle cx="30" cy="38" r="6" fill="#34D399" filter="url(#glow-subtle)"/>
    <text x="48" y="32" font-family="'Courier New', monospace" font-size="11" fill="#00F0FF" letter-spacing="2">TELEMETRY // LIVE</text>
    <text x="48" y="52" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">60 FPS STARFIELD RADAR</text>
  </g>

  <g transform="translate(820, 520)">
    <!-- Right HUD Metric Pill -->
    <rect width="320" height="75" rx="12" fill="rgba(10, 15, 36, 0.85)" stroke="rgba(138, 43, 226, 0.35)" stroke-width="1"/>
    <circle cx="30" cy="38" r="6" fill="#00F0FF" filter="url(#glow-subtle)"/>
    <text x="48" y="32" font-family="'Courier New', monospace" font-size="11" fill="#A78BFA" letter-spacing="2">ORBITAL RANGE</text>
    <text x="48" y="52" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="15" fill="#FFFFFF">4.2B KM DEEP-FIELD</text>
  </g>

  <!-- Centered Branding Typography -->
  <g transform="translate(600, 100)" text-anchor="middle">
    <rect x="-140" y="-32" width="280" height="28" rx="14" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1"/>
    <circle cx="-110" cy="-18" r="4" fill="#00F0FF"/>
    <text x="5" y="-14" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#00F0FF" letter-spacing="3">DEEP SPACE // 100% FRONTEND</text>
    <text y="35" font-family="'Segoe UI', 'Space Grotesk', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="6">NOVA ORBIT</text>
    <text y="62" font-family="'Segoe UI', sans-serif" font-size="14" fill="#94A3B8" letter-spacing="2">NEXT-GENERATION SPACE-TECH EXPLORATION PLATFORM</text>
  </g>
</svg>
