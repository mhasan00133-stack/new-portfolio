<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient: Daraz Tangerine Orange to Deep Charcoal -->
    <linearGradient id="bg-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F85606"/>
      <stop offset="55%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Warm Radial Flare -->
    <radialGradient id="sun-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#F85606" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow Filter -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.45"/>
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Warm E-Commerce Canvas -->
  <rect width="1200" height="675" fill="url(#bg-orange)"/>
  <rect width="1200" height="675" fill="url(#sun-glow)"/>

  <!-- Subtle Geometric Pakistani Lattice / Dot Grid -->
  <g fill="rgba(255, 255, 255, 0.08)">
    <circle cx="80" cy="80" r="3"/>
    <circle cx="160" cy="80" r="3"/>
    <circle cx="240" cy="80" r="3"/>
    <circle cx="320" cy="80" r="3"/>
    <circle cx="880" cy="80" r="3"/>
    <circle cx="960" cy="80" r="3"/>
    <circle cx="1040" cy="80" r="3"/>
    <circle cx="1120" cy="80" r="3"/>
    <circle cx="80" cy="160" r="3"/>
    <circle cx="160" cy="160" r="3"/>
    <circle cx="1040" cy="160" r="3"/>
    <circle cx="1120" cy="160" r="3"/>
    <circle cx="80" cy="560" r="3"/>
    <circle cx="160" cy="560" r="3"/>
    <circle cx="1040" cy="560" r="3"/>
    <circle cx="1120" cy="560" r="3"/>
  </g>

  <!-- Floating Discount Badges -->
  <g transform="translate(140, 110)">
    <rect width="150" height="42" rx="21" fill="#FFFFFF" filter="url(#card-shadow)"/>
    <text x="75" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="14" fill="#F85606" text-anchor="middle" letter-spacing="1">⚡ UP TO 70% OFF</text>
  </g>

  <g transform="translate(910, 110)">
    <rect width="160" height="42" rx="21" fill="#10B981" filter="url(#card-shadow)"/>
    <text x="80" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">✓ CASH ON DELIVERY</text>
  </g>

  <!-- Central Visual: Mega E-Commerce Bag & Trust Podium -->
  <g transform="translate(600, 310)" text-anchor="middle">
    <!-- Elevated Base Glow -->
    <ellipse cx="0" cy="140" rx="340" ry="40" fill="rgba(15, 23, 42, 0.45)"/>

    <!-- Shopping Bag Icon Silhouette -->
    <g transform="translate(-80, -90)">
      <!-- Bag Body -->
      <rect x="0" y="30" width="160" height="180" rx="24" fill="#FFFFFF" filter="url(#card-shadow)"/>
      <!-- Bag Handle -->
      <path d="M40 30 V-15 C40 -40, 120 -40, 120 -15 V30" fill="none" stroke="#F85606" stroke-width="12" stroke-linecap="round"/>
      <!-- Brand Logo Inside Bag -->
      <circle cx="80" cy="110" r="36" fill="#F85606"/>
      <path d="M68 112 L76 120 L94 102" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Floating Price Tag -->
    <g transform="translate(130, -30)">
      <rect width="140" height="50" rx="12" fill="#FFFFFF" filter="url(#card-shadow)"/>
      <text x="70" y="31" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#F85606">Rs. 4,490</text>
    </g>

    <!-- Floating Star Rating -->
    <g transform="translate(-250, 40)">
      <rect width="140" height="46" rx="12" fill="#FFFFFF" filter="url(#card-shadow)"/>
      <text x="70" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#0F172A">★ 4.9 (1.2k+)</text>
    </g>
  </g>

  <!-- Title & Branding -->
  <g transform="translate(600, 520)" text-anchor="middle">
    <text y="0" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="48" fill="#FFFFFF" letter-spacing="-1">
      Bazaar<tspan fill="#FEF08A">PK</tspan>
    </text>
    <text y="32" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="16" fill="rgba(255, 255, 255, 0.9)" letter-spacing="2">
      PAKISTANI DARAZ-STYLE E-COMMERCE PLATFORM
    </text>
    <text y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.75)">
      Pure Vanilla JS • Cash on Delivery • Real-Time Cart &amp; Courier Tracker • 16+ Localized Products in PKR
    </text>
  </g>
</svg>
